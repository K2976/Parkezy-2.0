# Render's free plan sleeps the API after 15 idle minutes and takes ~55 s to wake, longer than the
# app's request timeout. Pinging every 10 minutes keeps it warm. GitHub may delay scheduled runs, and
# disables them after 60 days without repo activity; an external monitor (UptimeRobot) is steadier.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://parkezy-api.onrender.com/health/live
