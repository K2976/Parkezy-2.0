services:
  - type: web
    name: parkezy-api
    runtime: docker
    rootDir: parkezy-innotech/backend
    dockerfilePath: Dockerfile
    dockerContext: .
    # API + Celery worker/beat in one container (free plan has no background workers). See the script.
    dockerCommand: sh render-start.sh
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    envVars:
      # One web worker leaves room for the Celery worker inside the free plan's 512 MB.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: Parkezy
      - key: API_PUBLIC_URL
        value: https://parkezy-api.onrender.com
      # Email via Resend. The key and webhook secret are set in the Render dashboard, never here.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: Parkezy <noreply@mail.kartik2976.xyz>
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: APP_DEEP_LINK_BASE
        value: parkezy://
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_CODE_SECRET
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_test_ZXhjaXRpbmctc2F3Zmx5LTMwNzkuY2xlcmsuYWNjb3VudHMuZGV2JA
      - key: CLERK_ISSUER
        value: https://exciting-sawfly-3079.clerk.accounts.dev
      - key: CLERK_JWKS_URL
        value: https://exciting-sawfly-3079.clerk.accounts.dev/.well-known/jwks.json
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        value: rzp_test_ToZcVVw8BtcJPq
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: S3_REGION
        value: us-east-005
      - key: S3_BUCKET
        value: parkezy-v2
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
