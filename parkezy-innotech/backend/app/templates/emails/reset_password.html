{% extends "_base.html" %}{% block content %}
<p>Hi {{ name }},</p>
<p>Use this code to choose a new password:</p>
<p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:20px 0;">{{ code }}</p>
<p style="color:#635F69;">The code expires in {{ ttl_minutes }} minutes. If you didn't ask to reset your password, you can ignore this email — your password stays the same.</p>
{% endblock %}
