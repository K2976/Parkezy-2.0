<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background:#F4F1FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#332F3A;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F1FA;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:32px;overflow:hidden;box-shadow:16px 16px 32px rgba(160,150,180,0.2);">
<tr><td style="padding:24px 28px 0;color:#6E5BC4;font-size:22px;font-weight:800;letter-spacing:-.2px;">{{ app_name }}</td></tr>
<tr><td style="padding:28px;font-size:15px;line-height:1.55;">
{% block content %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px 24px;font-size:12px;color:#635F69;border-top:1px solid #EFEBF5;">
You received this email because you have a {{ app_name }} account.
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
