# Local load-test monitoring. Prometheus pulls server-side metrics every 5 s; k6 pushes its
# client-side results in through remote write (Prometheus runs with the receiver enabled).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: loadtest

scrape_configs:
  # The API under test (loadtest/run_api.sh, port 8001). /metrics requires the bearer token
  # from loadtest/loadtest.env (METRICS_TOKEN); keep the two in sync.
  - job_name: parkezy-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: loadtest-metrics-token
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # CPU / memory / load of the machine running the test (the API runs on the host).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
